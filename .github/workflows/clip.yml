name: AI YouTube Clipper

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      request_id:
        description: "Job ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      CHAT_ID: ${{ inputs.chat_id }}
      REQUEST_ID: ${{ inputs.request_id }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GEMINI_MODEL: gemini-2.5-flash

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. INSTALL SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip


      # ==========================================
      # 3. INSTALL PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U "yt-dlp[default]" faster-whisper requests


      # ==========================================
      # 4. VERIFY INSTALLATION
      # ==========================================
      - name: Verify tools
        run: |
          echo "========================================"
          echo "FFmpeg"
          echo "========================================"
          ffmpeg -version | head -n 1

          echo ""
          echo "========================================"
          echo "yt-dlp"
          echo "========================================"
          python3 -m yt_dlp --version

          echo ""
          echo "========================================"
          echo "Python"
          echo "========================================"
          python3 --version

          echo ""
          echo "========================================"
          echo "YouTube extractors"
          echo "========================================"
          python3 -m yt_dlp --list-extractors | grep -i youtube | head -20 || true


      # ==========================================
      # 5. SEND START MESSAGE
      # ==========================================
      - name: Send started message
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🎬 Job ${REQUEST_ID} started.

Downloading video and finding the best moments..." \
            >/dev/null


      # ==========================================
      # 6. PREPARE YOUTUBE URL
      # ==========================================
      - name: Prepare YouTube URL
        run: |
          mkdir -p work

          CLEAN_URL="$(printf '%s' "$YOUTUBE_URL" | tr -d '\r\n')"

          echo "Original URL:"
          printf '[%s]\n' "$YOUTUBE_URL"

          echo ""
          echo "Clean URL:"
          printf '[%s]\n' "$CLEAN_URL"

          if [ -z "$CLEAN_URL" ]; then
            echo "ERROR: YouTube URL is empty."
            exit 1
          fi

          echo "$CLEAN_URL" > work/youtube_url.txt


      # ==========================================
      # 7. TEST YOUTUBE URL / EXTRACTOR
      # ==========================================
      - name: Test YouTube extraction
        run: |
          CLEAN_URL="$(cat work/youtube_url.txt)"

          echo "Testing YouTube extraction..."
          echo "URL: $CLEAN_URL"

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            --no-playlist \
            --force-ipv4 \
            --extractor-args "youtube:player_client=web,web_safari,android,tv" \
            "$CLEAN_URL"


      # ==========================================
      # 8. DOWNLOAD YOUTUBE VIDEO
      # ==========================================
      - name: Download YouTube video
        run: |
          CLEAN_URL="$(cat work/youtube_url.txt)"

          echo "========================================"
          echo "DOWNLOADING YOUTUBE VIDEO"
          echo "========================================"

          python3 -m yt_dlp \
            --verbose \
            --no-playlist \
            --force-ipv4 \
            --extractor-args "youtube:player_client=web,web_safari,android,tv" \
            -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]/b" \
            --merge-output-format mp4 \
            --restrict-filenames \
            --no-warnings \
            -o "work/source.%(ext)s" \
            "$CLEAN_URL"

          echo ""
          echo "========================================"
          echo "DOWNLOADED FILES"
          echo "========================================"

          ls -lah work/


      # ==========================================
      # 9. CHECK DOWNLOADED VIDEO
      # ==========================================
      - name: Verify downloaded video
        run: |
          if [ ! -f "work/source.mp4" ]; then
            echo "ERROR: work/source.mp4 was not created."

            echo ""
            echo "Files currently in work:"
            find work -maxdepth 2 -type f -print

            exit 1
          fi

          echo "Video found:"
          ls -lh work/source.mp4

          echo ""
          echo "Video information:"
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/source.mp4


      # ==========================================
      # 10. TRANSCRIBE VIDEO
      # ==========================================
      - name: Transcribe video
        run: |
          python3 scripts/transcribe.py \
            work/source.mp4 \
            work/transcript.json

          echo ""
          echo "Transcript created:"
          ls -lh work/transcript.json


      # ==========================================
      # 11. SELECT BEST CLIPS WITH GEMINI
      # ==========================================
      - name: Select best clips with Gemini
        run: |
          python3 scripts/select_clips.py \
            work/transcript.json \
            work/clips.json \
            "$GEMINI_API_KEY" \
            "$GEMINI_MODEL"

          echo ""
          echo "Selected clips:"
          cat work/clips.json


      # ==========================================
      # 12. RENDER VERTICAL CLIPS
      # ==========================================
      - name: Render vertical clips
        run: |
          mkdir -p work/output

          python3 scripts/render_clips.py \
            work/source.mp4 \
            work/transcript.json \
            work/clips.json \
            work/output

          echo ""
          echo "Rendered clips:"
          find work/output -maxdepth 1 -type f -print


      # ==========================================
      # 13. SEND CLIPS TO TELEGRAM
      # ==========================================
      - name: Send clips to Telegram
        run: |
          python3 scripts/send_telegram.py \
            work/clips.json \
            work/output \
            "$TELEGRAM_BOT_TOKEN" \
            "$CHAT_ID"


      # ==========================================
      # 14. COMPLETION MESSAGE
      # ==========================================
      - name: Send completion message
        if: success()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Job ${REQUEST_ID} completed!
             Your AI-selected clips have been sent above." \
            >/dev/null


      # ==========================================
      # 15. FAILURE MESSAGE
      # ==========================================
      - name: Send failure message
        if: failure()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=❌ Job ${REQUEST_ID} failed.
            Check the GitHub Actions log for the exact error." \
            >/dev/null


      # ==========================================
      # 16. CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf work
