name: AI YouTube Clipper

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      request_id:
        description: "Job ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      CHAT_ID: ${{ inputs.chat_id }}
      REQUEST_ID: ${{ inputs.request_id }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

      GEMINI_MODEL: gemini-2.5-flash

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ==========================================
      # 3. SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip


      # ==========================================
      # 4. PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install -U \
            "yt-dlp[default]" \
            faster-whisper \
            requests \
            bgutil-ytdlp-pot-provider


      # ==========================================
      # 5. INSTALL BGUTIL PO TOKEN PROVIDER
      # ==========================================
      - name: Install BgUtils PO Token Provider
        run: |
          set -e

          git clone \
            --single-branch \
            --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          npm ci

          npx tsc

          cd ../..

          echo "BgUtils provider installed."


      # ==========================================
      # 6. START BGUTIL SERVER
      # ==========================================
      - name: Start PO Token Server
        shell: bash
        run: |
          set -e

          cd bgutil-ytdlp-pot-provider/server

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > "$GITHUB_WORKSPACE/bgutil-provider.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/bgutil-provider.pid"

          cd ../..

          echo "Waiting for PO Token server..."

          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/4416) 2>/dev/null; then
              echo "PO Token server is running."
              break
            fi

            sleep 2
          done

          if ! (echo > /dev/tcp/127.0.0.1/4416) 2>/dev/null; then
            echo "ERROR: PO Token server failed to start."
            cat bgutil-provider.log || true
            exit 1
          fi


      # ==========================================
      # 7. VERIFY TOOLS
      # ==========================================
      - name: Verify tools
        run: |
          echo "Python:"
          python3 --version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "yt-dlp:"
          python3 -m yt_dlp --version

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "PO Token providers:"

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            "https://www.youtube.com/watch?v=M9NQT9q7PEE" \
            2>&1 | grep -E \
            "PO Token Providers|bgutil" \
            | head -20 || true


      # ==========================================
      # 8. SEND START MESSAGE
      # ==========================================
      - name: Send started message
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode \
            "text=🎬 Job ${REQUEST_ID} started. Downloading video and finding the best moments..." \
            >/dev/null


      # ==========================================
      # 9. CREATE WORK DIRECTORY
      # ==========================================
      - name: Create work directory
        run: |
          mkdir -p work


      # ==========================================
      # 10. NORMALIZE YOUTUBE URL
      # ==========================================
      - name: Normalize YouTube URL
        shell: bash
        run: |
          set -e

          RAW_URL="$(printf '%s' "$YOUTUBE_URL" | tr -d '\r\n')"

          echo "Received YouTube URL:"
          printf '<%s>\n' "$RAW_URL"

          VIDEO_ID=""

          if [[ "$RAW_URL" =~ youtube\.com/watch\?[^[:space:]]*v=([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtu\.be/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtube\.com/shorts/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$VIDEO_ID" ]]; then
            echo "ERROR: Could not extract YouTube video ID."
            exit 1
          fi

          CANONICAL_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"

          echo "Video ID:"
          echo "$VIDEO_ID"

          echo "Canonical URL:"
          echo "$CANONICAL_URL"

          printf '%s' "$CANONICAL_URL" > work/youtube_url.txt


      # ==========================================
      # 11. PREPARE YOUTUBE COOKIES
      # ==========================================
      - name: Prepare YouTube cookies
        shell: bash
        run: |
          set -e

          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "ERROR: YOUTUBE_COOKIES_B64 GitHub Secret is missing."
            exit 1
          fi

          printf '%s' "$YOUTUBE_COOKIES_B64" \
            | base64 --decode \
            > work/youtube_cookies.txt

          chmod 600 work/youtube_cookies.txt

          echo "Cookie file created."

          if ! head -n 1 work/youtube_cookies.txt | grep -Eq \
            '^# (HTTP Cookie File|Netscape HTTP Cookie File)'; then

            echo "ERROR: Invalid cookies.txt format."
            exit 1
          fi

          echo "Cookie format verified."


      # ==========================================
      # 12. TEST YOUTUBE EXTRACTION
      # ==========================================
      - name: Test YouTube extraction
        shell: bash
        run: |
          set -e

          URL="$(cat work/youtube_url.txt)"

          echo "========================================"
          echo "TESTING YOUTUBE EXTRACTION"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          echo ""

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            --no-playlist \
            --force-ipv4 \
            --cookies "work/youtube_cookies.txt" \
            --ies "youtube" \
            --extractor-args "youtube:player_client=mweb" \
            "$URL"


      # ==========================================
      # 13. DOWNLOAD YOUTUBE VIDEO
      # ==========================================
      - name: Download YouTube video
        shell: bash
        run: |
          set -e

          URL="$(cat work/youtube_url.txt)"

          echo "========================================"
          echo "DOWNLOADING VIDEO"
          echo "========================================"

          python3 -m yt_dlp \
            --verbose \
            --no-playlist \
            --force-ipv4 \
            --cookies "work/youtube_cookies.txt" \
            --ies "youtube" \
            --extractor-args "youtube:player_client=mweb" \
            -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]/b" \
            --merge-output-format mp4 \
            --restrict-filenames \
            -o "work/source.%(ext)s" \
            "$URL"

          echo ""
          echo "Download result:"

          find work -maxdepth 1 -type f -ls


      # ==========================================
      # 14. VERIFY VIDEO
      # ==========================================
      - name: Verify downloaded video
        shell: bash
        run: |
          set -e

          if [ ! -f "work/source.mp4" ]; then
            echo "ERROR: work/source.mp4 was not created."

            echo ""
            echo "Files found:"
            find work -maxdepth 2 -type f -print

            exit 1
          fi

          echo "Video successfully downloaded."

          ls -lh work/source.mp4

          echo ""

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/source.mp4


      # ==========================================
      # 15. TRANSCRIBE
      # ==========================================
      - name: Transcribe video
        run: |
          python3 scripts/transcribe.py \
            work/source.mp4 \
            work/transcript.json

          echo "Transcript created:"
          ls -lh work/transcript.json


      # ==========================================
      # 16. GEMINI CLIP SELECTION
      # ==========================================
      - name: Select best clips with Gemini
        run: |
          python3 scripts/select_clips.py \
            work/transcript.json \
            work/clips.json \
            "$GEMINI_API_KEY" \
            "$GEMINI_MODEL"

          echo ""
          echo "Selected clips:"
          cat work/clips.json


      # ==========================================
      # 17. RENDER VERTICAL CLIPS
      # ==========================================
      - name: Render vertical clips
        run: |
          mkdir -p work/output

          python3 scripts/render_clips.py \
            work/source.mp4 \
            work/transcript.json \
            work/clips.json \
            work/output

          echo ""
          echo "Rendered clips:"
          find work/output -maxdepth 1 -type f -print


      # ==========================================
      # 18. SEND CLIPS TO TELEGRAM
      # ==========================================
      - name: Send clips to Telegram
        run: |
          python3 scripts/send_telegram.py \
            work/clips.json \
            work/output \
            "$TELEGRAM_BOT_TOKEN" \
            "$CHAT_ID"


      # ==========================================
      # 19. SUCCESS MESSAGE
      # ==========================================
      - name: Send completion message
        if: success()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode \
            "text=✅ Job ${REQUEST_ID} completed! Your AI-selected clips are ready." \
            >/dev/null


      # ==========================================
      # 20. FAILURE MESSAGE
      # ==========================================
      - name: Send failure message
        if: failure()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode \
            "text=❌ Job ${REQUEST_ID} failed. Open GitHub Actions to see the failed step." \
            >/dev/null


      # ==========================================
      # 21. SHOW PO TOKEN LOG
      # ==========================================
      - name: Show PO Token provider log
        if: always()
        run: |
          echo "========================================"
          echo "BGUTIL PROVIDER LOG"
          echo "========================================"

          if [ -f "bgutil-provider.log" ]; then
            cat bgutil-provider.log
          else
            echo "No provider log found."
          fi


      # ==========================================
      # 22. CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          if [ -f "bgutil-provider.pid" ]; then
            kill "$(cat bgutil-provider.pid)" 2>/dev/null || true
          fi

          rm -rf work
          rm -rf bgutil-ytdlp-pot-provider
          rm -f work_youtube_url.txt
