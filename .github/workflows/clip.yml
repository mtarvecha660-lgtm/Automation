name: AI YouTube Clipper

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      request_id:
        description: "Job ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      CHAT_ID: ${{ inputs.chat_id }}
      REQUEST_ID: ${{ inputs.request_id }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GEMINI_MODEL: gemini-2.5-flash

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. INSTALL SYSTEM TOOLS
      # ==========================================
      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip


      # ==========================================
      # 3. INSTALL PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U "yt-dlp[default]" faster-whisper requests


      # ==========================================
      # 4. VERIFY TOOLS
      # ==========================================
      - name: Verify tools
        run: |
          echo "========================================"
          echo "Python"
          echo "========================================"
          python3 --version

          echo ""
          echo "========================================"
          echo "yt-dlp"
          echo "========================================"
          python3 -m yt_dlp --version

          echo ""
          echo "========================================"
          echo "FFmpeg"
          echo "========================================"
          ffmpeg -version | head -n 1

          echo ""
          echo "========================================"
          echo "YouTube extractor"
          echo "========================================"
          python3 -m yt_dlp --list-extractors | grep -i "^youtube" | head -20 || true


      # ==========================================
      # 5. SEND START MESSAGE
      # ==========================================
      - name: Send started message
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🎬 Job ${REQUEST_ID} started. Downloading video and finding the best moments..." \
            >/dev/null


      # ==========================================
      # 6. NORMALIZE YOUTUBE URL
      # ==========================================
      - name: Normalize YouTube URL
        shell: bash
        run: |
          set -e

          RAW_URL="$(printf '%s' "$YOUTUBE_URL" | tr -d '\r\n')"

          echo "Raw URL:"
          printf '<%s>\n' "$RAW_URL"

          VIDEO_ID=""

          # Standard YouTube watch URL
          if [[ "$RAW_URL" =~ youtube\.com/watch\?[^[:space:]]*v=([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          # Short youtu.be URL
          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtu\.be/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          # Shorts URL
          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtube\.com/shorts/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$VIDEO_ID" ]]; then
            echo "ERROR: Could not extract a YouTube video ID."
            echo "Received:"
            printf '<%s>\n' "$RAW_URL"
            exit 1
          fi

          CANONICAL_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"

          echo ""
          echo "Extracted video ID:"
          echo "$VIDEO_ID"

          echo ""
          echo "Canonical YouTube URL:"
          echo "$CANONICAL_URL"

          printf '%s' "$CANONICAL_URL" > work_youtube_url.txt


      # ==========================================
      # 7. TEST YOUTUBE EXTRACTOR
      # ==========================================
      - name: Test YouTube extraction
        shell: bash
        run: |
          set -e

          URL="$(cat work_youtube_url.txt)"

          echo "========================================"
          echo "TESTING YOUTUBE EXTRACTOR"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          echo ""
          echo "Running yt-dlp..."

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            --no-playlist \
            --force-ipv4 \
            --ies "youtube" \
            --extractor-args "youtube:player_client=ios,mweb" \
            "$URL"


      # ==========================================
      # 8. DOWNLOAD VIDEO
      # ==========================================
      - name: Download YouTube video
        shell: bash
        run: |
          set -e

          mkdir -p work

          URL="$(cat work_youtube_url.txt)"

          echo "========================================"
          echo "DOWNLOADING VIDEO"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          python3 -m yt_dlp \
            --verbose \
            --no-playlist \
            --force-ipv4 \
            --ies "youtube" \
            --extractor-args "youtube:player_client=ios,mweb" \
            -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]/b" \
            --merge-output-format mp4 \
            --restrict-filenames \
            -o "work/source.%(ext)s" \
            "$URL"

          echo ""
          echo "========================================"
          echo "DOWNLOAD RESULT"
          echo "========================================"

          find work -maxdepth 1 -type f -ls


      # ==========================================
      # 9. VERIFY VIDEO
      # ==========================================
      - name: Verify downloaded video
        shell: bash
        run: |
          set -e

          if [ ! -f "work/source.mp4" ]; then
            echo "ERROR: work/source.mp4 was not created."

            echo ""
            echo "Files found:"
            find work -maxdepth 2 -type f -print

            exit 1
          fi

          echo "Video successfully downloaded."

          ls -lh work/source.mp4

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/source.mp4


      # ==========================================
      # 10. TRANSCRIBE
      # ==========================================
      - name: Transcribe video
        run: |
          python3 scripts/transcribe.py \
            work/source.mp4 \
            work/transcript.json

          echo ""
          echo "Transcript:"
          ls -lh work/transcript.json


      # ==========================================
      # 11. GEMINI CLIP SELECTION
      # ==========================================
      - name: Select best clips with Gemini
        run: |
          python3 scripts/select_clips.py \
            work/transcript.json \
            work/clips.json \
            "$GEMINI_API_KEY" \
            "$GEMINI_MODEL"

          echo ""
          echo "Gemini selected:"
          cat work/clips.json


      # ==========================================
      # 12. RENDER VERTICAL CLIPS
      # ==========================================
      - name: Render vertical clips
        run: |
          mkdir -p work/output

          python3 scripts/render_clips.py \
            work/source.mp4 \
            work/transcript.json \
            work/clips.json \
            work/output

          echo ""
          echo "Rendered clips:"
          find work/output -maxdepth 1 -type f -print


      # ==========================================
      # 13. SEND CLIPS TO TELEGRAM
      # ==========================================
      - name: Send clips to Telegram
        run: |
          python3 scripts/send_telegram.py \
            work/clips.json \
            work/output \
            "$TELEGRAM_BOT_TOKEN" \
            "$CHAT_ID"


      # ==========================================
      # 14. SUCCESS MESSAGE
      # ==========================================
      - name: Send completion message
        if: success()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Job ${REQUEST_ID} completed! Your AI-selected clips are ready." \
            >/dev/null

      # ==========================================
      # 15. FAILURE MESSAGE
      # ==========================================
      - name: Send failure message
        if: failure()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=❌ Job ${REQUEST_ID} failed. Open GitHub Actions to see the exact failed step." \
            >/dev/null

      # ==========================================
      # 16. CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf work
          rm -f work_youtube_url.txt
