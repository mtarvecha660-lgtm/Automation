name: AI YouTube Clipper

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      request_id:
        description: "Job ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      CHAT_ID: ${{ inputs.chat_id }}
      REQUEST_ID: ${{ inputs.request_id }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GEMINI_MODEL: gemini-2.5-flash

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ==========================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip


      # ==========================================
      # 4. INSTALL PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install -U \
            "yt-dlp[default]" \
            faster-whisper \
            requests \
            bgutil-ytdlp-pot-provider


      # ==========================================
      # 5. INSTALL BGUTIL PO TOKEN SERVER
      # ==========================================
      - name: Install BgUtils PO Token Provider
        run: |
          set -e

          echo "Cloning bgutil-ytdlp-pot-provider 2.0.0..."

          git clone \
            --single-branch \
            --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          echo "Installing Node dependencies..."

          npm ci

          echo "Building provider..."

          npx tsc

          echo "Provider build complete."

          cd ../..

          echo ""
          echo "Provider files:"
          ls -lah bgutil-ytdlp-pot-provider/server/


      # ==========================================
      # 6. START PO TOKEN SERVER
      # ==========================================
      - name: Start PO Token Server
        shell: bash
        run: |
          set -e

          cd bgutil-ytdlp-pot-provider/server

          echo "Starting BgUtils PO Token server..."

          nohup node build/main.js \
            --host 127.0.0.1 \
            --port 4416 \
            > "$GITHUB_WORKSPACE/bgutil-provider.log" 2>&1 &

          PROVIDER_PID=$!

          echo "$PROVIDER_PID" > "$GITHUB_WORKSPACE/bgutil-provider.pid"

          cd ../..

          echo "Provider PID: $PROVIDER_PID"

          echo "Waiting for provider..."

          for i in {1..30}; do

            if curl -sS \
              --max-time 2 \
              http://127.0.0.1:4416/ \
              >/dev/null 2>&1; then

              echo "PO Token provider is responding."

              break
            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo ""
          echo "Provider log:"

          cat bgutil-provider.log || true

          echo ""
          echo "Checking port 4416..."

          if ! (echo > /dev/tcp/127.0.0.1/4416) 2>/dev/null; then
            echo "ERROR: PO Token provider is not listening on port 4416."

            cat bgutil-provider.log || true

            exit 1
          fi

          echo "PO Token provider is running."


      # ==========================================
      # 7. VERIFY INSTALLATION
      # ==========================================
      - name: Verify tools
        run: |
          echo "========================================"
          echo "Python"
          echo "========================================"

          python3 --version

          echo ""
          echo "========================================"
          echo "Node"
          echo "========================================"

          node --version

          echo ""
          echo "========================================"
          echo "npm"
          echo "========================================"

          npm --version

          echo ""
          echo "========================================"
          echo "yt-dlp"
          echo "========================================"

          python3 -m yt_dlp --version

          echo ""
          echo "========================================"
          echo "FFmpeg"
          echo "========================================"

          ffmpeg -version | head -n 1

          echo ""
          echo "========================================"
          echo "PO TOKEN PROVIDERS"
          echo "========================================"

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            "https://www.youtube.com/watch?v=M9NQT9q7PEE" \
            2>&1 | grep -E \
            "PO Token Providers|bgutil|youtube]" \
            | head -30 || true


      # ==========================================
      # 8. SEND START MESSAGE
      # ==========================================
      - name: Send started message
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🎬 Job ${REQUEST_ID} started. Downloading video and finding the best moments..." \
            >/dev/null


      # ==========================================
      # 9. NORMALIZE YOUTUBE URL
      # ==========================================
      - name: Normalize YouTube URL
        shell: bash
        run: |
          set -e

          mkdir -p work

          RAW_URL="$(printf '%s' "$YOUTUBE_URL" | tr -d '\r\n')"

          echo "Raw URL:"
          printf '<%s>\n' "$RAW_URL"

          VIDEO_ID=""

          # Standard YouTube watch URL
          if [[ "$RAW_URL" =~ youtube\.com/watch\?[^[:space:]]*v=([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          # Short YouTube URL
          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtu\.be/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          # YouTube Shorts
          if [[ -z "$VIDEO_ID" && "$RAW_URL" =~ youtube\.com/shorts/([A-Za-z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$VIDEO_ID" ]]; then
            echo "ERROR: Could not extract YouTube video ID."

            printf '<%s>\n' "$RAW_URL"

            exit 1
          fi

          CANONICAL_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"

          echo ""
          echo "Video ID:"
          echo "$VIDEO_ID"

          echo ""
          echo "Canonical URL:"
          echo "$CANONICAL_URL"

          printf '%s' "$CANONICAL_URL" > work/youtube_url.txt


      # ==========================================
      # 10. TEST YOUTUBE + PO TOKEN
      # ==========================================
      - name: Test YouTube extraction
        shell: bash
        run: |
          set -e

          URL="$(cat work/youtube_url.txt)"

          echo "========================================"
          echo "TESTING YOUTUBE + PO TOKEN"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          echo ""

          python3 -m yt_dlp \
            --verbose \
            --simulate \
            --no-playlist \
            --force-ipv4 \
            --ies "youtube" \
            --extractor-args "youtube:player_client=mweb" \
            "$URL"


      # ==========================================
      # 11. DOWNLOAD YOUTUBE VIDEO
      # ==========================================
      - name: Download YouTube video
        shell: bash
        run: |
          set -e

          URL="$(cat work/youtube_url.txt)"

          echo "========================================"
          echo "DOWNLOADING YOUTUBE VIDEO"
          echo "========================================"

          echo "URL:"
          echo "$URL"

          python3 -m yt_dlp \
            --verbose \
            --no-playlist \
            --force-ipv4 \
            --ies "youtube" \
            --extractor-args "youtube:player_client=mweb" \
            -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]/b" \
            --merge-output-format mp4 \
            --restrict-filenames \
            -o "work/source.%(ext)s" \
            "$URL"

          echo ""
          echo "========================================"
          echo "DOWNLOAD RESULT"
          echo "========================================"

          find work -maxdepth 1 -type f -ls


      # ==========================================
      # 12. VERIFY VIDEO
      # ==========================================
      - name: Verify downloaded video
        shell: bash
        run: |
          set -e

          if [ ! -f "work/source.mp4" ]; then
            echo "ERROR: work/source.mp4 was not created."

            echo ""
            echo "Files found:"

            find work -maxdepth 2 -type f -print

            exit 1
          fi

          echo "Video successfully downloaded."

          ls -lh work/source.mp4

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/source.mp4


      # ==========================================
      # 13. TRANSCRIBE
      # ==========================================
      - name: Transcribe video
        run: |
          python3 scripts/transcribe.py \
            work/source.mp4 \
            work/transcript.json

          echo ""
          echo "Transcript created:"

          ls -lh work/transcript.json


      # ==========================================
      # 14. GEMINI CLIP SELECTION
      # ==========================================
      - name: Select best clips with Gemini
        run: |
          python3 scripts/select_clips.py \
            work/transcript.json \
            work/clips.json \
            "$GEMINI_API_KEY" \
            "$GEMINI_MODEL"

          echo ""
          echo "Selected clips:"

          cat work/clips.json


      # ==========================================
      # 15. RENDER VERTICAL CLIPS
      # ==========================================
      - name: Render vertical clips
        run: |
          mkdir -p work/output

          python3 scripts/render_clips.py \
            work/source.mp4 \
            work/transcript.json \
            work/clips.json \
            work/output

          echo ""
          echo "Rendered clips:"

          find work/output -maxdepth 1 -type f -print


      # ==========================================
      # 16. SEND CLIPS TO TELEGRAM
      # ==========================================
      - name: Send clips to Telegram
        run: |
          python3 scripts/send_telegram.py \
            work/clips.json \
            work/output \
            "$TELEGRAM_BOT_TOKEN" \
            "$CHAT_ID"


      # ==========================================
      # 17. SUCCESS MESSAGE
      # ==========================================
      - name: Send completion message
        if: success()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Job ${REQUEST_ID} completed! Your AI-selected clips are ready." \
            >/dev/null


      # ==========================================
      # 18. FAILURE MESSAGE
      # ==========================================
      - name: Send failure message
        if: failure()
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=❌ Job ${REQUEST_ID} failed. Open GitHub Actions to see the exact failed step." \
            >/dev/null


      # ==========================================
      # 19. SHOW PO TOKEN LOG ON FAILURE
      # ==========================================
      - name: Show PO Token provider log
        if: always()
        run: |
          echo "========================================"
          echo "BGUTIL PROVIDER LOG"
          echo "========================================"

          if [ -f "bgutil-provider.log" ]; then
            cat bgutil-provider.log
          else
            echo "No provider log found."
          fi


      # ==========================================
      # 20. CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          if [ -f "bgutil-provider.pid" ]; then
            kill "$(cat bgutil-provider.pid)" 2>/dev/null || true
          fi

          rm -rf work
          rm -rf bgutil-ytdlp-pot-provider
          rm -f work_youtube_url.txt
